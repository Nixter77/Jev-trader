[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-trader"
version = "0.1.0"
description = "Jev × Binance paper/testnet trading bot (v1 skeleton)"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk",
    "python-dotenv",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jev-trader = "jev_trader.cli:main"

[tool.setuptools.packages.find]
include = ["jev_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
